
# ~/.config/kitty/kitty.conf

# Wayland or X11
linux_display_server wayland


# --- Шрифты ---
# font_family FiraCode Nerd Font  
font_size 14.0


# bold_font auto
# italic_font auto

# --- Поведение окна ---
enable_audio_bell no
scrollback_lines 10000
detect_urls yes
background_opacity 1

# --- Цвета ---
# include ./light_theme.conf
# include ./ayu_theme.conf
# foreground #cdd6f4
# background #1e1e2e
# cursor     #f5c2e7

# color0  #1e1e2e0
# color1  #f38ba8
# color2  #a6e3a1
# color3  #f9e2af
# color4  #89b4fa
# color5  #f5c2e7
# color6  #94e2d5
# color7  #bac2de
# color8  #585b70
# color9  #f38ba8
# color10 #a6e3a1
# color11 #f9e2af
# color12 #89b4fa
# color13 #f5c2e7
# color14 #94e2d5
# color15 #a6adc8

# --- Горячие клавиши ---
# map ctrl+shift+c copy_to_clipboard
# map ctrl+shift+v paste_from_clipboard


# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTSinclude current-theme.conf


# BEGIN_KITTY_THEME
# Ayu
include current-theme.conf
# END_KITTY_THEME
wayland_enable_ime no
color_scheme_listener enable
wayland_titlebar_color background

