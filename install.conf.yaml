- defaults:
    link:
      create: true    # создаст недостающие папки (на стороне назначения)
      relink: true    # перезалинкует, если уже есть неправильная ссылка

- link:
    ~/.zshrc: zsh/.zshrc
    ~/.p10k.zsh: zsh/.p10k.zsh
    ~/.oh-my-zsh: zsh/.oh-my-zsh
    ~/.config/kitty: kitty
    ~/.config/flameshot: flameshot
    ~/.config/sxhkd: sxhkd
    ~/.config/Code/User/settings.json: vscode/settings.json
    ~/.config/Code/User/keybindings.json: vscode/keybindings.json
    ~/.gitconfig: .gitconfig
    ~/.zshenv: zsh/.zshenv
